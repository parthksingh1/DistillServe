[project]
name = "distillserve-otel"
version = "0.1.0"
description = "Shared OpenTelemetry setup with GenAI semantic conventions for DistillServe."
requires-python = ">=3.11,<3.13"
dependencies = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distillserve_otel"]
