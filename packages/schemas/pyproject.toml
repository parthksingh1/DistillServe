[project]
name = "distillserve-schemas"
version = "0.1.0"
description = "Pydantic models shared across DistillServe services; source of truth for generated TS types."
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distillserve_schemas"]
