name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels the in-flight run for that PR; main is never
# cancelled so every commit on the default branch keeps a green/red record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # CI has no provider keys, and it must not need them: the test environment
  # relaxes the "at least one provider key" invariant, and nothing in the test
  # suite reaches a network.
  DISTILLSERVE_ENV: test
  DISTILLSERVE_MODE: hosted
  FORCE_COLOR: '1'

permissions:
  contents: read

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: ruff
        run: uv run ruff check --output-format=github .

      - name: black
        run: uv run black --check --diff .

      - name: mypy --strict
        run: uv run mypy .

      - name: pytest
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Reference dataset is consistent with its sources
        run: uv run python scripts/refresh_reference_dataset.py --check

      - name: Generated TypeScript types are not stale
        run: uv run python scripts/generate_ts_types.py --check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

  web:
    name: Web — lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm run format:check

      - name: ESLint
        run: pnpm run lint

      - name: tsc --noEmit
        run: pnpm run typecheck

      - name: vitest
        run: pnpm --filter @distillserve/web test

      - name: Build
        run: pnpm run build

  gateway-smoke:
    name: Gateway — boots and serves /healthz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The unit suite exercises the app through ASGI; this job proves the real
    # uvicorn process starts, binds a port and answers a probe — which is the
    # failure mode a test client cannot catch.
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - run: uv python install 3.11
      - run: uv sync --all-packages --frozen

      - name: Start gateway in sandbox mode
        env:
          DISTILLSERVE_MODE: sandbox
          GROQ_API_KEY: ci-placeholder-not-used
          DISTILLSERVE_LOG_JSON: 'true'
        run: |
          uv run uvicorn distillserve_gateway.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz > /dev/null && break
            sleep 1
          done

      - name: Deploy check against the local process
        run: uv run python scripts/deploy_check.py --base-url http://127.0.0.1:8000

  e2e:
    name: Playwright — end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The unit suites test the pieces; this proves the joins — that a
    # Playground call produces a trace, and a rollback produces a dashboard
    # event. It is the job that says the platform is actually live.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: uv python install 3.11
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @distillserve/web exec playwright install --with-deps chromium

      - name: Run the end-to-end scenario
        env:
          DISTILLSERVE_MODE: sandbox
          DISTILLSERVE_ENV: test
        run: pnpm --filter @distillserve/web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  pre-commit:
    name: pre-commit (all files)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: uv python install 3.11
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - run: uv run pre-commit run --all-files --show-diff-on-failure
