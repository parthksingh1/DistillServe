# ---------------------------------------------------------------------------
# Source catalog for the DistillServe reference benchmark dataset.
#
# `data/reference/` is the telemetry source for `DISTILLSERVE_MODE=sandbox`.
# Every number that reaches a dashboard in that mode traces back to an entry
# here, so this file is the dataset's provenance record: `make reference-refresh`
# validates it and stamps a content hash into `data/reference/manifest.json`,
# and the UI links each figure to its `source_id`.
#
# Adding data without adding its source is a build failure, by design.
# ---------------------------------------------------------------------------
version: 1

sources:
  - id: vllm-anatomy-2025-09
    title: 'Inside vLLM: Anatomy of a High-Throughput LLM Inference System'
    publisher: vLLM
    url: https://vllm.ai/blog/2025-09-05-anatomy-of-vllm
    published: 2025-09-05
    retrieved: 2026-09-04
    license: 'Blog post — cited, not redistributed'
    provides:
      - continuous-batching behaviour under load
      - prefix-caching hit-rate characteristics
      - scheduler and paged-attention model behind the KV-pressure trace

  - id: vllm-fp8-kvcache
    title: 'The State of FP8 KV-Cache and Attention Quantization in vLLM'
    publisher: vLLM
    url: https://vllm.ai/blog/fp8-kvcache
    published: 2025-08-14
    retrieved: 2026-09-04
    license: 'Blog post — cited, not redistributed'
    provides:
      - FP8 KV-cache throughput and ITL deltas versus BF16
      - KV-cache capacity multiplier used to size the reference pool

  - id: redhat-eagle3-2025-07
    title: 'Fly Eagle(3) fly: Faster inference with vLLM & speculative decoding'
    publisher: Red Hat Developer
    url: https://developers.redhat.com/articles/2025/07/01/fly-eagle3-fly-faster-inference-vllm-speculative-decoding
    published: 2025-07-01
    retrieved: 2026-09-04
    license: 'Article — cited, not redistributed'
    provides:
      - EAGLE-3 acceptance-rate and speedup curves versus request rate
      - GuideLLM methodology for the TTFT / ITL sweep shape

  - id: distillserve-canonical-run
    title: 'DistillServe canonical run — 8xH100 vLLM deployment'
    publisher: DistillServe
    url: internal://bench/canonical-run
    published: 2026-08-20
    retrieved: 2026-09-04
    license: 'Generated by this repository; regenerate with `make reference-refresh`'
    provides:
      - recorded gateway traces for the reference workload
      - rollout, Karpenter scaling and spot-reclaim event history
      - adapter and model-registry records with per-slice quality scores

# Cluster shape the reference telemetry represents. Every derived rate in the
# dataset (tok/s, $/M tokens, GPU-seconds) is computed against this shape, so
# changing a value here changes the whole dataset — which is why it is checked
# in next to the sources rather than hard-coded in the store.
reference_deployment:
  accelerator: NVIDIA H100 80GB SXM
  gpu_count: 8
  tensor_parallel_size: 2
  replicas: 4
  serving_engine: vLLM
  weight_dtype: FP8
  kv_cache_dtype: FP8
  speculative_decoding: EAGLE-3
  prefix_caching: true
  scheduler: continuous batching
