  - { id: adp-tone-rewrite, task: rewrite, rank: 8, share: 0.087, quality: 0.926 }
  - { id: adp-kb-answer, task: question_answering, rank: 16, share: 0.079, quality: 0.871 }
  - { id: adp-contract-extract, task: extraction, rank: 32, share: 0.061, quality: 0.933 }
  - { id: adp-release-notes, task: summarization, rank: 8, share: 0.054, quality: 0.905 }
  - { id: adp-intent-router, task: classification, rank: 8, share: 0.047, quality: 0.962 }
