# --- Rollouts --------------------------------------------------------------
rollouts:
  - id: rol-2026-08-fp8-dpo
    name: FP8 + DPO student to full traffic
    candidate: mv-student-dpo-fp8-001
    baseline: mv-student-005
    stage: full
    notes: Completed migration with zero quality incidents.
  - id: rol-2026-09-student-006
    name: Student 1.3.0 canary
    candidate: mv-student-006
    baseline: mv-student-dpo-fp8-001
    stage: canary_50
    notes: Parity ahead of baseline on every slice except reasoning.
  - id: rol-2026-09-dpo-003
    name: DPO 1.2.0 shadow
    candidate: mv-student-dpo-003
    baseline: mv-student-dpo-fp8-001
    stage: shadow
    notes: Shadow traffic only; scoring against the teacher before any exposure.
  - id: rol-2026-07-int4
    name: INT4 student rollback
    candidate: mv-student-int4-001
    baseline: mv-student-005
    stage: rolled_back
    notes: Auto-rolled back at canary_10 on a reasoning-slice parity breach.

