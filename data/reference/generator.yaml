# --- Eval configuration ----------------------------------------------------
evals:
  judge_model: groq/llama-3.3-70b-versatile
  gate_threshold: 0.95
  judge_drift: 0.013
  calibration_cases: 40
  adversarial:
    - { suite: prompt_injection, attempts: 120, blocked: 116 }
    - { suite: jailbreak, attempts: 80, blocked: 76 }
    - { suite: distribution_shift, attempts: 100, blocked: 88 }
