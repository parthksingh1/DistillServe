# ---------------------------------------------------------------------------
# Parameters for the reference benchmark dataset.
#
# `make reference-refresh` reads this file plus sources/catalog.yaml and emits
# every payload under data/reference/. Nothing in the dataset is hand-edited:
# changing a number here and regenerating is the only supported way to change
# what sandbox mode reports, which is what keeps the whole dataset internally
# consistent (throughput, cost and utilisation are derived from one another).
#
# Every figure below traces to a `source_id` in sources/catalog.yaml.
# ---------------------------------------------------------------------------
source_id: distillserve-canonical-run
version: 2

# --- Headline figures ------------------------------------------------------
# These are the measured results of the canonical run. Everything else in the
# dataset is derived from them, so they appear exactly once.
headline:
  # Sustained decode throughput per H100 at steady state, FP8 weights + FP8 KV
  # cache + EAGLE-3 speculative decoding + prefix caching.
  tokens_per_second_per_gpu: 3100
  # p95 time to first token under the reference workload's arrival rate.
  p95_ttft_ms: 210
  p50_ttft_ms: 118
  p99_ttft_ms: 340
  # Inter-token latency. EAGLE-3 accepts multiple draft tokens per verify
  # step, which is what pulls this below the 1/3100s a non-speculative
  # decoder would give.
  p50_itl_ms: 9.4
  p95_itl_ms: 18.1
  # Blended serving cost after FP8 + KV-cache tuning, versus the frontier API
  # it replaced. The ratio is what the Overview hero reports.
  usd_per_million_tokens: 0.19
  frontier_usd_per_million_tokens: 2.80
  # Weighted per-slice quality parity of the distilled student against the
  # teacher, on the stratified test set.
  quality_parity: 0.974
  test_set_cases: 300
  # Idle GPU spend removed by queue-depth + TTFT-driven Karpenter scaling
  # with a spot/on-demand mix, versus static provisioning.
  idle_gpu_spend_reduction: 0.41
  spot_fraction: 0.72
  # EAGLE-3 draft acceptance rate; the reason ITL is what it is.
  acceptance_rate: 0.71
  cache_hit_rate: 0.31

# --- Workload shape --------------------------------------------------------
# The arrival pattern the traces are generated against. A single sinusoid plus
# noise rather than a flat line, because a flat load curve makes autoscaling
# look trivially easy and hides the cold-start cost that dominates real
# operation.
workload:
  # Calibrated so peak load saturates all 8 GPUs (~3,100 tok/s each) while
  # mean load leaves the headroom the TTFT objective needs.
  requests_per_second_mean: 62.0
  requests_per_second_amplitude: 26.0
  period_hours: 24
  noise_fraction: 0.08
  mean_input_tokens: 1180
  mean_output_tokens: 260

# --- Cluster -------------------------------------------------------------
cluster:
  gpu_count: 8
  min_nodes: 3
  max_nodes: 8
  kv_cache_gb_per_gpu: 42.5
  memory_total_gb: 80.0
  # Seconds from Karpenter provisioning a node to it serving traffic. This is
  # the number that makes aggressive scale-down expensive, so it is explicit.
  cold_start_seconds: 94

# --- Evaluation slices -----------------------------------------------------
# The stratified test set's composition. Slice names are the join key across
# routing, adapters and eval reports, so they match TASK_LABELS exactly.
slices:
  - { name: summarization, cases: 52, student: 0.912, teacher: 0.928 }
  - { name: extraction, cases: 48, student: 0.941, teacher: 0.949 }
  - { name: classification, cases: 44, student: 0.958, teacher: 0.966 }
  - { name: sql_generation, cases: 38, student: 0.884, teacher: 0.913 }
  - { name: rewrite, cases: 34, student: 0.926, teacher: 0.938 }
  - { name: question_answering, cases: 30, student: 0.871, teacher: 0.902 }
  - { name: reasoning, cases: 28, student: 0.782, teacher: 0.874 }
  - { name: code_generation, cases: 26, student: 0.803, teacher: 0.881 }

# --- Adapters --------------------------------------------------------------
