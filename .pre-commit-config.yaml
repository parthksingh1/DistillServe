# Hooks run on every commit; CI re-runs the same set with `pre-commit run --all-files`
# so a green local commit and a green PR mean the same thing.
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: ['--allow-multiple-documents'] # k8s manifests are multi-doc
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format
        # Formatting is owned by black; ruff-format would fight it.
        stages: [manual]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        # mypy needs the real environment to resolve FastAPI/Pydantic types, so
        # it runs through uv against the synced workspace rather than in
        # pre-commit's isolated venv.
        language: system
        entry: uv run mypy
        pass_filenames: false
        args: ['.']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: system
        entry: pnpm run lint
        pass_filenames: false
        files: ^apps/web/.*\.(ts|tsx|js|jsx)$
      - id: prettier
        name: prettier
        language: system
        entry: pnpm run format:check
        pass_filenames: false
        files: ^apps/web/.*\.(ts|tsx|css|json|md)$
