# Hooks run on every commit; CI re-runs the same set with
# `pre-commit run --all-files`, so a green local commit and a green PR mean the
# same thing.
#
# ruff, black, mypy, eslint and prettier all run as `language: system` through
# uv/pnpm against the synced workspace, rather than in pre-commit's own isolated
# environments. Pinning versions here as well would put two versions of each
# linter in one project, and a commit could pass locally while CI failed on a
# rule the other version happens to have.
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        # The README's screenshot grid is deliberate, checked-in binary content
        # and the full-page Overview shot is just over 1MB. The check still
        # exists to catch a model checkpoint or a stray recording.
        args: ['--maxkb=1536']
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: ['--allow-multiple-documents'] # k8s manifests are multi-doc
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        language: system
        entry: uv run ruff check --fix
        types: [python]

      - id: black
        name: black
        language: system
        entry: uv run black
        types: [python]

      - id: mypy
        name: mypy
        # mypy needs the real environment to resolve FastAPI and Pydantic
        # types, so it runs against the synced workspace rather than an
        # isolated venv.
        language: system
        entry: uv run mypy
        args: ['.']
        pass_filenames: false
        types: [python]

      - id: eslint
        name: eslint
        language: system
        entry: pnpm run lint
        pass_filenames: false
        files: ^apps/web/.*\.(ts|tsx|js|jsx)$

      - id: prettier
        name: prettier
        language: system
        entry: pnpm run format:check
        pass_filenames: false
        files: \.(ts|tsx|css|json|md|ya?ml)$
