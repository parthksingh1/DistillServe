# Root of the DistillServe Python workspace.
#
# This file is deliberately NOT a distributable package: it exists so that `uv`
# can resolve one lockfile across the gateway service and the two shared
# libraries. Every Python member declares its own dependencies; the root only
# owns workspace membership, the dev toolchain, and the lint/type/test config
# that must be identical everywhere.
[project]
name = "distillserve-workspace"
version = "0.1.0"
description = "DistillServe — self-hosted LLM inference and task-specific distillation platform."
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
# Installed for every member via `uv sync`; kept out of `project.dependencies`
# so the Render production image can `uv sync --no-dev`.
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "asgi-lifespan>=2.1",
  "anyio>=4.4",
  "ruff>=0.7",
  "black>=24.10",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "pre-commit>=4.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["apps/gateway", "packages/schemas", "packages/otel"]

[tool.uv.sources]
distillserve-schemas = { workspace = true }
distillserve-otel = { workspace = true }

# ---------------------------------------------------------------------------
# Formatting / linting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/gateway/src", "packages/schemas/src", "packages/otel/src"]
extend-exclude = [".venv", "node_modules", "apps/web", "data"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "A",        # builtin shadowing
  "C4",       # comprehensions
  "SIM",      # simplify
  "TID",      # tidy imports
  "PTH",      # prefer pathlib
  "RUF",
  "D",        # pydocstyle — every module/class/function is documented
  "ANN",      # annotations required
  "ASYNC",
  "S",        # bandit
]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "ANN401", # Any is occasionally the honest type (e.g. **kwargs passthrough)
]

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts, skip docstrings on trivial cases, and hardcode fixtures.
# Tests may assert, and their local stubs and fixtures do not need the
# docstring/annotation discipline that production modules do.
# Tests may assert, may hardcode fixture tokens (S105/S106), and their local
# stubs do not need the docstring/annotation discipline production code does.
"**/tests/**" = ["S101", "S105", "S106", "D1", "ANN0", "ANN2", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
mypy_path = "apps/gateway/src:packages/schemas/src:packages/otel/src:scripts"
namespace_packages = true
explicit_package_bases = true
exclude = ['^\.venv/', '^apps/web/']

[[tool.mypy.overrides]]
# Test modules stay type-checked, but they legitimately poke at duck-typed
# stubs and monkeypatched attributes. Unused-ignore warnings there are noise
# about the stubs, not signal about the code under test.
module = ["tests.*", "conftest"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
# Third-party packages that ship no stubs. Kept as an explicit allow-list so a
# new untyped dependency is a conscious decision rather than a silent hole.
module = ["litellm.*", "structlog.*", "prometheus_client.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["apps/gateway/tests", "packages/schemas/tests", "packages/otel/tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:distillserve.*"]

[tool.coverage.run]
branch = true
source = ["apps/gateway/src", "packages/schemas/src", "packages/otel/src"]
