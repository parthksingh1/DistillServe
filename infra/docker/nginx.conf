server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The console is a single-page app: every unknown path must fall through to
  # index.html, or a deep link like /rollouts 404s on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API, mirroring the Vite dev proxy and the Vercel rewrite.
  location /api/ {
    proxy_pass http://gateway:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # SSE needs buffering off and a long read timeout, or the dashboard's
    # telemetry stream is chopped into batches and the Playground's TTFT
    # measurement becomes meaningless.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location ~* \.(js|css|woff2|svg|png)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
