# `docker compose -f infra/docker/docker-compose.yml up --build` is the
# "try it in 5 minutes" path: it brings up Redis, the gateway in sandbox mode
# and the web console, with no GPU and no cloud account required.
name: distillserve

services:
  redis:
    image: redis:7.4-alpine
    # AOF on so the semantic cache and rate-limit buckets survive a restart,
    # which is what makes a local demo reproducible across `up`/`down` cycles.
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.gateway
    ports: ['8000:8000']
    environment:
      DISTILLSERVE_MODE: ${DISTILLSERVE_MODE:-sandbox}
      DISTILLSERVE_ENV: local
      DISTILLSERVE_LOG_JSON: 'false'
      DISTILLSERVE_CORS_ALLOW_ORIGINS: http://localhost:5173
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      redis:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @distillserve/web dev --host 0.0.0.0"
    ports: ['5173:5173']
    environment:
      VITE_GATEWAY_URL: http://gateway:8000
    volumes:
      - ../..:/app
      - web-node-modules:/app/node_modules
    depends_on: [gateway]

volumes:
  redis-data:
  web-node-modules:
