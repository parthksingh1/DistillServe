[project]
name = "distillserve-gateway"
version = "0.1.0"
description = "DistillServe gateway — OpenAI-compatible routing, caching, guardrails and telemetry."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "pyyaml>=6.0",
  "litellm>=1.52",
  "distillserve-schemas",
  "distillserve-otel",
]

[project.optional-dependencies]
# Local ML models for the semantic cache's embeddings and the prompt-injection
# classifier. Kept optional so the Render image stays small and cold starts
# stay fast: without the extra, the rules layers still run and the model layers
# report as degraded on /readyz rather than failing the service.
ml = [
  "sentence-transformers>=3.2",
  "transformers>=4.46",
  "torch>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distillserve_gateway"]
